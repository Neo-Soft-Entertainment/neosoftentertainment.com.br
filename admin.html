<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    document.documentElement.setAttribute('data-theme', 'dark');
  </script>
  <meta name="robots" content="noindex,nofollow" />
  <title>Neo Soft Admin</title>
  <meta name="theme-color" content="#03050a" />
  <link rel="icon" href="img/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="img/icons/icon-180.png" sizes="180x180" />

  <link rel="stylesheet" href="css/experience.css" />
</head>

<body class="experience-site">
  <canvas id="neoWebglCanvas" class="neo-webgl-canvas" aria-hidden="true"></canvas>
  <div id="webglFallback" class="webgl-fallback" aria-hidden="true"></div>
  <div id="cursor" class="cursor-follower" aria-hidden="true"></div>

  <div class="site-loader" data-loader aria-hidden="true">
    <div class="site-loader__mark">Neo Soft</div>
    <div class="site-loader__line"><span></span></div>
    <p>Initializing interactive studio layer</p>
  </div>

  <header id="navbar" class="site-header">
    <a href="index.html" class="brand-link" aria-label="Neo Soft - Home">
      <img src="img/neosoft.jpg" alt="Neo Soft logo" />
      <span>Neo Soft Admin</span>
    </a>
  </header>

  <main class="admin-shell">
    <section id="adminSetup" class="admin-panel hidden" aria-live="polite">
      <p class="admin-eyebrow">Setup required</p>
      <h1 class="admin-title">Admin configuration is missing.</h1>
      <p class="admin-copy">Add the Supabase URL, public key, and hCaptcha site key in
        <code>js/site-config.js</code>.</p>
    </section>

    <section id="loginPanel" class="admin-panel admin-login">
      <p class="admin-eyebrow">Direct access</p>
      <h1 class="admin-title">Sign in</h1>
      <form id="loginForm" class="admin-form">
        <label>
          <span>Email</span>
          <input id="adminEmail" class="input" name="email" type="email" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input id="adminPassword" class="input" name="password" type="password" autocomplete="current-password"
            required />
        </label>
        <div id="captchaSlot" class="admin-recaptcha"></div>
        <button id="loginButton" class="btn btn-primary magnetic" type="submit">Sign in</button>
        <p id="loginStatus" class="admin-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <nav id="adminTabs" class="admin-editor__actions hidden" style="margin-bottom:1.5rem;" aria-label="Admin sections">
      <button id="tabPosts" class="btn btn-primary magnetic" type="button">Posts</button>
      <button id="tabContent" class="btn btn-secondary magnetic" type="button">Website content</button>
    </nav>

    <section id="postsPanel" class="admin-editor hidden">
      <div class="admin-editor__bar">
        <div>
          <p class="admin-eyebrow">News / Blog</p>
          <h1 class="admin-title">Posts</h1>
        </div>
        <div class="admin-editor__actions">
          <button id="newPostBtn" class="btn btn-primary magnetic" type="button">New post</button>
          <button id="signOutPosts" class="btn btn-secondary magnetic" type="button">Sign out</button>
        </div>
      </div>
      <p id="postsStatus" class="admin-status" role="status" aria-live="polite"></p>
      <div id="postsList" class="admin-content"></div>
    </section>

    <section id="postEditor" class="admin-editor hidden">
      <div class="admin-editor__bar">
        <div>
          <p class="admin-eyebrow" id="postEditorEyebrow">New post</p>
          <h1 class="admin-title" id="postEditorTitle">Create post</h1>
        </div>
        <div class="admin-editor__actions">
          <button id="savePost" class="btn btn-primary magnetic" type="button">Save post</button>
          <button id="cancelPostEdit" class="btn btn-secondary magnetic" type="button">Cancel</button>
        </div>
      </div>
      <p id="postEditorStatus" class="admin-status" role="status" aria-live="polite"></p>
      <form id="postForm" class="admin-form" onsubmit="return false">
        <label>
          <span>Title</span>
          <input id="postTitle" class="input" type="text" required />
        </label>
        <label>
          <span>Slug</span>
          <input id="postSlug" class="input" type="text" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required />
        </label>
        <label>
          <span>Excerpt</span>
          <textarea id="postExcerpt" class="textarea" rows="2" required></textarea>
        </label>
        <label>
          <span>Body</span>
          <textarea id="postBody" class="textarea" rows="8"></textarea>
        </label>
        <label>
          <span>Cover image URL</span>
          <input id="postCoverImage" class="input" type="url" />
        </label>
        <label style="display:flex; flex-direction:row; align-items:center; gap:.6rem;">
          <input id="postPublished" type="checkbox" style="width:1.1rem; height:1.1rem;" />
          <span>Published</span>
        </label>
        <button id="deletePost" class="btn btn-secondary hidden" type="button">Delete post</button>
      </form>
    </section>

    <section id="editorPanel" class="admin-editor hidden">
      <div class="admin-editor__bar">
        <div>
          <p class="admin-eyebrow">Published overrides</p>
          <h1 class="admin-title">Website content</h1>
        </div>
        <div class="admin-editor__actions">
          <button id="saveContent" class="btn btn-primary magnetic" type="button">Save changes</button>
          <button id="signOut" class="btn btn-secondary magnetic" type="button">Sign out</button>
        </div>
      </div>

      <div class="admin-filters">
        <label>
          <span>Language</span>
          <select id="contentLanguage" class="input"></select>
        </label>
        <label>
          <span>Filter key</span>
          <input id="contentFilter" class="input" type="search" autocomplete="off" />
        </label>
      </div>

      <p id="editorStatus" class="admin-status" role="status" aria-live="polite"></p>
      <div id="contentFields" class="admin-content"></div>
    </section>
  </main>

  <button id="backToTop" class="hidden" aria-hidden="true" tabindex="-1"></button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/webgl-experience.js"></script>
  <script src="js/motion-experience.js"></script>
  <script src="js/site-config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>

</html>
