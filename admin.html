<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('neosoft-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta name="robots" content="noindex,nofollow" />
  <title>Neo Soft Admin</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="img/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="img/icons/icon-180.png" sizes="180x180" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {

          boxShadow: { glow: '0 1px 2px rgba(0,0,0,.4)' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-black text-white selection:bg-neutral-200 antialiased overflow-x-hidden">
  <header id="navbar" class="fixed top-0 w-full z-50 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3" aria-label="Neo Soft - Home">
        <img src="img/neosoft.jpg" alt="Neo Soft logo" class="h-9 w-9 rounded-md object-cover" />
        <span class="text-base sm:text-lg font-semibold">Neo Soft Admin</span>
      </a>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle light and dark theme" type="button">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 1020.354 15.354z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="admin-shell">
    <section id="adminSetup" class="admin-panel hidden" aria-live="polite">
      <p class="admin-eyebrow">Setup required</p>
      <h1 class="admin-title">Admin configuration is missing.</h1>
      <p class="admin-copy">Add the Supabase URL, public key, and hCaptcha site key in <code>js/site-config.js</code>.</p>
    </section>

    <section id="loginPanel" class="admin-panel admin-login">
      <p class="admin-eyebrow">Direct access</p>
      <h1 class="admin-title">Sign in</h1>
      <form id="loginForm" class="admin-form">
        <label>
          <span>Email</span>
          <input id="adminEmail" class="input" name="email" type="email" autocomplete="username" required />
        </label>
        <label>
          <span>Password</span>
          <input id="adminPassword" class="input" name="password" type="password" autocomplete="current-password"
            required />
        </label>
        <div id="captchaSlot" class="admin-recaptcha"></div>
        <button id="loginButton" class="btn-primary" type="submit">Sign in</button>
        <p id="loginStatus" class="admin-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <nav id="adminTabs" class="admin-editor__actions hidden" style="margin-bottom:1.5rem;" aria-label="Admin sections">
      <button id="tabPosts" class="btn-primary" type="button">Posts</button>
      <button id="tabContent" class="btn-outline" type="button">Website content</button>
    </nav>

    <section id="postsPanel" class="admin-editor hidden">
      <div class="admin-editor__bar">
        <div>
          <p class="admin-eyebrow">News / Blog</p>
          <h1 class="admin-title">Posts</h1>
        </div>
        <div class="admin-editor__actions">
          <button id="newPostBtn" class="btn-primary" type="button">New post</button>
          <button id="signOutPosts" class="btn-outline" type="button">Sign out</button>
        </div>
      </div>
      <p id="postsStatus" class="admin-status" role="status" aria-live="polite"></p>
      <div id="postsList" class="admin-content"></div>
    </section>

    <section id="postEditor" class="admin-editor hidden">
      <div class="admin-editor__bar">
        <div>
          <p class="admin-eyebrow" id="postEditorEyebrow">New post</p>
          <h1 class="admin-title" id="postEditorTitle">Create post</h1>
        </div>
        <div class="admin-editor__actions">
          <button id="savePost" class="btn-primary" type="button">Save post</button>
          <button id="cancelPostEdit" class="btn-outline" type="button">Cancel</button>
        </div>
      </div>
      <p id="postEditorStatus" class="admin-status" role="status" aria-live="polite"></p>
      <form id="postForm" class="admin-form" onsubmit="return false">
        <label>
          <span>Title</span>
          <input id="postTitle" class="input" type="text" required />
        </label>
        <label>
          <span>Slug</span>
          <input id="postSlug" class="input" type="text" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required />
        </label>
        <label>
          <span>Excerpt</span>
          <textarea id="postExcerpt" class="textarea" rows="2" required></textarea>
        </label>
        <label>
          <span>Body</span>
          <textarea id="postBody" class="textarea" rows="8"></textarea>
        </label>
        <label>
          <span>Cover image URL</span>
          <input id="postCoverImage" class="input" type="url" />
        </label>
        <label style="display:flex; flex-direction:row; align-items:center; gap:.6rem;">
          <input id="postPublished" type="checkbox" style="width:1.1rem; height:1.1rem;" />
          <span>Published</span>
        </label>
        <button id="deletePost" class="btn-outline hidden" type="button">Delete post</button>
      </form>
    </section>

    <section id="editorPanel" class="admin-editor hidden">
      <div class="admin-editor__bar">
        <div>
          <p class="admin-eyebrow">Published overrides</p>
          <h1 class="admin-title">Website content</h1>
        </div>
        <div class="admin-editor__actions">
          <button id="saveContent" class="btn-primary" type="button">Save changes</button>
          <button id="signOut" class="btn-outline" type="button">Sign out</button>
        </div>
      </div>

      <div class="admin-filters">
        <label>
          <span>Language</span>
          <select id="contentLanguage" class="input"></select>
        </label>
        <label>
          <span>Filter key</span>
          <input id="contentFilter" class="input" type="search" autocomplete="off" />
        </label>
      </div>

      <p id="editorStatus" class="admin-status" role="status" aria-live="polite"></p>
      <div id="contentFields" class="admin-content"></div>
    </section>
  </main>

  <button id="backToTop" class="hidden" aria-hidden="true" tabindex="-1"></button>

  <script src="js/site-config.js"></script>
  <script src="js/script.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>

</html>
